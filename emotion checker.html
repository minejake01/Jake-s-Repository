<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindful Moments | Mood Tracker</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --primary-accent: #6c63ff;
            --text-main: #2d3436;
            --streak-gold: #f1c40f;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
        }

        header h1 { margin-bottom: 0.5rem; color: var(--primary-accent); }

        .streak-badge {
            display: inline-block;
            background: #fff9db;
            color: #856404;
            padding: 5px 15px;
            border-radius: 15px;
            font-weight: bold;
            margin-bottom: 2rem;
            border: 1px solid var(--streak-gold);
        }

        .mood-selector {
            display: flex;
            justify-content: space-around;
            margin-bottom: 2rem;
        }

        .mood-btn {
            font-size: 2.5rem;
            background: none;
            border: 2px solid transparent;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            padding: 10px;
        }

        .mood-btn:hover {
            transform: scale(1.2);
            background: #f8f9fa;
        }

        .mood-btn.selected {
            border-color: var(--primary-accent);
            background: #eeeefd;
        }

        .reflection-area {
            margin-top: 1.5rem;
            text-align: left;
        }

        #prompt-text {
            font-style: italic;
            color: #636e72;
            margin-bottom: 10px;
            display: block;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #dfe6e9;
            border-radius: 10px;
            resize: none;
            font-family: inherit;
            box-sizing: border-box;
        }

        button#save-btn {
            margin-top: 1.5rem;
            width: 100%;
            padding: 12px;
            background-color: var(--primary-accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button#save-btn:hover { opacity: 0.9; }

        .history {
            margin-top: 2rem;
            border-top: 1px solid #eee;
            padding-top: 1rem;
            font-size: 0.9rem;
            color: #b2bec3;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>How are you?</h1>
        <div class="streak-badge">🔥 <span id="streak-count">0</span> Day Streak</div>
    </header>

    <div class="mood-selector">
        <button class="mood-btn" onclick="selectMood('😢', this)">😢</button>
        <button class="mood-btn" onclick="selectMood('😐', this)">😐</button>
        <button class="mood-btn" onclick="selectMood('🙂', this)">🙂</button>
        <button class="mood-btn" onclick="selectMood('😄', this)">😄</button>
    </div>

    <div class="reflection-area">
        <span id="prompt-text">Loading prompt...</span>
        <textarea id="reflection-input" placeholder="Write your thoughts here..."></textarea>
    </div>

    <button id="save-btn" onclick="saveEntry()">Check In</button>

    <div class="history">
        <p id="last-checkin">Last check-in: Never</p>
    </div>
</div>

    ];

        displayRandomPrompt();
        updateUI();
    };
