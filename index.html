    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a1a; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }

    #phaser-canvas {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
    }
    #phaser-canvas canvas { width: 100% !important; height: 100% !important; }

    #ui {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10; display: flex; justify-content: center;
      overflow-y: auto; padding: 20px 16px 40px;
    }

    .panel { width: 100%; max-width: 520px; }

    /* ── Header ── */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 18px;
    }
    .app-title { font-size: 1.2rem; font-weight: 800; color: #e2e8f0; }
    .app-title span { color: #a78bfa; }
    .header-right { display: flex; gap: 8px; align-items: center; }

    .streak-pill {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      padding: 8px 14px; border-radius: 999px; font-weight: 700;
      font-size: 0.85rem; color: white;
      box-shadow: 0 0 16px rgba(168,85,247,0.5); white-space: nowrap;
    }

    /* ── Language picker ── */
    .lang-wrap { position: relative; }
    .lang-btn {
      background: rgba(20,20,44,0.85); border: 1px solid rgba(90,90,150,0.5);
      color: #c4c4e0; padding: 7px 11px; border-radius: 10px; cursor: pointer;
      font-size: 0.82rem; backdrop-filter: blur(6px); font-family: inherit;
    }
    .lang-btn:hover { border-color: #a78bfa; }
    .lang-menu {
      display: none; position: absolute; top: calc(100% + 6px); right: 0;
      background: #14142e; border: 1px solid rgba(90,90,150,0.5);
      border-radius: 12px; overflow: hidden; z-index: 100;
      min-width: 140px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .lang-menu.open { display: block; }
    .lang-opt {
      display: block; width: 100%; padding: 9px 14px; background: transparent;
      border: none; color: #c4c4e0; cursor: pointer; text-align: left;
      font-size: 0.82rem; font-family: inherit;
    }
    .lang-opt:hover { background: rgba(124,58,237,0.2); }
    .lang-opt.active { background: rgba(124,58,237,0.3); color: #e2e8f0; }

    /* ── Card ── */
    .card {
      background: rgba(14,14,32,0.78); border: 1px solid rgba(70,70,120,0.45);
      border-radius: 20px; padding: 22px; backdrop-filter: blur(10px);
      margin-bottom: 14px;
    }
    .card-label {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px;
      color: #6060a0; margin-bottom: 16px;
    }

    /* ── Mood grid — bigger buttons ── */
    .mood-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 11px;
      margin-bottom: 16px;
    }
    .mood-btn {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 16px 6px 13px; border-radius: 16px; cursor: pointer;
      border: 2px solid rgba(60,60,100,0.4);
      background: rgba(12,12,28,0.6);
      color: #888; font-size: 0.68rem; font-family: inherit;
      transition: all 0.12s ease;
    }
    .mood-btn .em { font-size: 2rem; line-height: 1; }
    .mood-btn:hover { transform: translateY(-3px); border-color: rgba(120,100,200,0.6); color: #ccc; }
    .mood-btn.sel { color: #fff; }

    /* ── Prompt + save ── */
    .prompt-box {
      background: rgba(100,60,200,0.1); border: 1px solid rgba(124,58,237,0.25);
      border-radius: 12px; padding: 13px 16px; margin-bottom: 13px;
      color: #c4b5fd; font-size: 0.9rem; font-style: italic; text-align: center;
    }
    .save-btn {
      width: 100%; padding: 14px; background: linear-gradient(135deg,#7c3aed,#a855f7);
      color: white; border: none; border-radius: 12px;
      font-size: 0.97rem; font-weight: 600; cursor: pointer; font-family: inherit;
      transition: opacity 0.15s, transform 0.1s;
    }
    .save-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .save-btn:active { transform: scale(0.98); }

    /* ── Already-logged state ── */
    .logged-card { text-align: center; }
    .logged-emoji { font-size: 3.8rem; margin-bottom: 10px; }
    .logged-title { font-size: 1.05rem; font-weight: 700; color: #e2e8f0; margin-bottom: 6px; }
    .logged-sub { font-size: 0.82rem; color: #6060a0; }
    .logged-streak { font-size: 2.2rem; font-weight: 800; color: #a78bfa; margin-top: 16px; }
    .logged-streak-label { font-size: 0.76rem; color: #6060a0; margin-top: 3px; }
    .change-btn {
      margin-top: 16px; background: transparent;
      border: 1.5px solid rgba(90,90,150,0.45); color: #8080b8;
      padding: 9px 22px; border-radius: 999px; cursor: pointer;
      font-size: 0.82rem; font-family: inherit; transition: all 0.15s;
    }
    .change-btn:hover { border-color: #a78bfa; color: #c4b5fd; background: rgba(124,58,237,0.1); }
    .cancel-link {
      display: block; text-align: center; margin-top: 10px;
      color: #6060a0; font-size: 0.8rem; cursor: pointer; background: none;
      border: none; font-family: inherit; width: 100%;
    }
    .cancel-link:hover { color: #a0a0c0; }

    /* ── Milestone banner ── */
    .milestone-banner {
      background: linear-gradient(135deg,rgba(124,58,237,0.35),rgba(168,85,247,0.2));
      border: 1px solid rgba(168,85,247,0.55); border-radius: 18px;
      padding: 20px; margin-bottom: 14px; text-align: center;
      backdrop-filter: blur(8px);
    }
    .milestone-banner .big { font-size: 2.2rem; margin-bottom: 8px; }
    .milestone-banner p { color: #e2e8f0; font-size: 0.93rem; font-weight: 600; line-height: 1.45; }
    .milestone-ok {
      margin-top: 13px; background: rgba(124,58,237,0.4);
      border: 1px solid rgba(168,85,247,0.5); color: #e2e8f0;
      padding: 8px 24px; border-radius: 999px; cursor: pointer;
      font-size: 0.83rem; font-family: inherit;
    }
    .milestone-ok:hover { background: rgba(124,58,237,0.65); }

    /* ── Background picker ── */
    .bg-grid { display: flex; gap: 8px; flex-wrap: wrap; }
    .bg-btn {
      padding: 7px 13px; border-radius: 10px; cursor: pointer;
      font-size: 0.78rem; font-family: inherit;
      border: 1.5px solid rgba(60,60,100,0.4);
      background: rgba(12,12,28,0.6); color: #9090b8;
      transition: all 0.12s;
    }
    .bg-btn:hover { border-color: #7c3aed; color: #c4c4e0; }
    .bg-btn.active { border-color: #a78bfa; background: rgba(124,58,237,0.25); color: #e2e8f0; }

    /* ── History drawer ── */
    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      z-index: 40; opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

    .drawer {
      position: fixed; top: 0; right: 0; height: 100%;
      width: min(360px, 92vw);
      background: #0e0e22; border-left: 1px solid rgba(70,70,120,0.5);
      z-index: 50; display: flex; flex-direction: column;
      transform: translateX(100%); transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
      box-shadow: -8px 0 32px rgba(0,0,0,0.5);
    }
    .drawer.open { transform: translateX(0); }

    .drawer-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 20px 14px; border-bottom: 1px solid rgba(70,70,120,0.35);
      flex-shrink: 0;
    }
    .drawer-title { font-size: 1rem; font-weight: 700; color: #e2e8f0; }
    .drawer-close {
      background: rgba(60,60,100,0.35); border: 1px solid rgba(90,90,150,0.4);
      color: #9090b8; width: 32px; height: 32px; border-radius: 8px;
      cursor: pointer; font-size: 1rem; display: flex; align-items: center;
      justify-content: center; font-family: inherit; transition: all 0.12s;
    }
    .drawer-close:hover { background: rgba(124,58,237,0.25); color: #e2e8f0; border-color: #a78bfa; }

    .drawer-body {
      flex: 1; overflow-y: auto; padding: 14px 16px 24px;
      scrollbar-width: thin; scrollbar-color: rgba(124,58,237,0.3) transparent;
    }

    .hist-empty {
      text-align: center; color: #4a4a70; font-size: 0.88rem;
      padding: 48px 20px;
    }
    .hist-empty .hist-empty-icon { font-size: 2.5rem; margin-bottom: 10px; }

    .hist-group-label {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px;
      color: #50508a; margin: 16px 0 8px; padding-left: 2px;
    }
    .hist-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; border-radius: 14px; margin-bottom: 8px;
      background: rgba(20,20,44,0.7); border: 1px solid rgba(60,60,100,0.35);
      transition: border-color 0.12s;
    }
    .hist-item:hover { border-color: rgba(124,58,237,0.4); }
    .hist-item .hi-emoji { font-size: 1.75rem; flex-shrink: 0; line-height: 1; }
    .hist-item .hi-info { flex: 1; min-width: 0; }
    .hist-item .hi-mood { font-weight: 600; font-size: 0.9rem; color: #e2e8f0; }
    .hist-item .hi-date { font-size: 0.74rem; color: #6060a0; margin-top: 2px; }
    .hist-item .hi-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }

    .hist-btn {
      background: rgba(20,20,44,0.85); border: 1px solid rgba(90,90,150,0.4);
      color: #c4c4e0; padding: 7px 11px; border-radius: 10px; cursor: pointer;
      font-size: 0.82rem; backdrop-filter: blur(6px); font-family: inherit;
      transition: border-color 0.12s;
    }
    .hist-btn:hover { border-color: #a78bfa; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #7c3aed; color: white; padding: 11px 22px;
      border-radius: 999px; font-weight: 600; font-size: 0.88rem;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      z-index: 200; white-space: nowrap; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>

const SK = 'moodbuddy_v2';
function loadState() {
  try { return JSON.parse(localStorage.getItem(SK)) || mkDefault(); }
  catch { return mkDefault(); }
}
function mkDefault() {
  return { entries:[], bestStreak:0, unlockedBgs:['default'], currentBg:'default', lang:'en' };
}
function persist(s) { localStorage.setItem(SK, JSON.stringify(s)); }

//  STREAK
// ═══════════════════════════════════════════════════
function todayStr() { return new Date().toISOString().slice(0,10); }

function calcStreak(entries) {
  if (!entries.length) return 0;
  const dates = [...new Set(entries.map(e => e.date))].sort().reverse();
  const today = todayStr();
  const yest  = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if (dates[0] !== today && dates[0] !== yest) return 0;
  let s = 1;
  for (let i = 1; i < dates.length; i++) {
    const diff = (new Date(dates[i-1]+'T00:00:00') - new Date(dates[i]+'T00:00:00')) / 86400000;
    if (diff === 1) s++; else break;
  }
  return s;
}

// ═══════════════════════════════════════════════════
//  PHASER — BACKGROUND SCENE
// ═══════════════════════════════════════════════════
class BgScene extends Phaser.Scene {
  constructor() { super({ key:'BgScene' }); }

  create() {
    this._current = null;
    this._objs    = [];
    this.switchTo(app.currentBg);
  }

  switchTo(name) {
    if (this._current === name) return;
    this._clear();
    this._current = name;
    const W = this.scale.width, H = this.scale.height;
    switch (name) {
      case 'sunset_beach':    this._sunsetBeach(W,H); break;
      case 'cozy_forest':     this._cozyForest(W,H);  break;
      case 'starry_night':    this._starryNight(W,H); break;
      case 'mountain_summit': this._mountain(W,H);    break;
      default:                this._aurora(W,H);      break;
    }
  }

  _clear() {
    this._objs.forEach(o => o && o.destroy && o.destroy());
    this._objs = [];
    this.tweens.killAll();
  }

  _add(obj) { this._objs.push(obj); return obj; }

  // ── Aurora (default) ─────────────────────────────
  // Dark teal-to-indigo sky with animated aurora ribbons, stars, and a moon
  _aurora(W, H) {
    // Sky gradient: deep teal top → dark navy bottom
    const sky = this._add(this.add.graphics());
    sky.fillGradientStyle(0x020e18, 0x020e18, 0x080420, 0x080420, 1);
    sky.fillRect(0, 0, W, H);

    // Distant stars (static small dots)
    for (let i = 0; i < 70; i++) {
      const st = this._add(this.add.graphics());
      const bright = 0.25 + Math.random() * 0.55;
      st.fillStyle(0xffffff, bright);
      st.fillCircle(0, 0, Math.random() * 1.2 + 0.3);
      st.setPosition(Phaser.Math.Between(0, W), Phaser.Math.Between(0, H * 0.9));
      if (Math.random() > 0.6) {
        this.tweens.add({ targets:st, alpha:{from:bright,to:0.05},
          duration:Phaser.Math.Between(1200,4000), yoyo:true, repeat:-1,
          delay:Phaser.Math.Between(0,3000) });
      }
    }

    // Crescent moon
    const moon = this._add(this.add.graphics());
    moon.fillStyle(0xe8f4f8, 0.88);
    moon.fillCircle(0, 0, 26);
    moon.fillStyle(0x020e18, 1);
    moon.fillCircle(9, -5, 20);
    moon.setPosition(W * 0.82, H * 0.1);
    // Soft halo
    const halo = this._add(this.add.graphics());
    halo.fillStyle(0xc0e8ff, 0.04);
    halo.fillCircle(0, 0, 60);
    halo.setPosition(W * 0.82, H * 0.1);
    this.tweens.add({ targets:halo, scaleX:1.3, scaleY:1.3, alpha:0.01,
      duration:3500, yoyo:true, repeat:-1 });

    // Aurora ribbons — 4 wavy horizontal bands with different colors
    const auroraColors = [
      { c:0x00e5b0, a:0.07 },  // teal-green
      { c:0x5b5bff, a:0.06 },  // indigo-blue
      { c:0x00c8e0, a:0.05 },  // cyan
      { c:0xa040ff, a:0.04 },  // violet
    ];

    auroraColors.forEach(({ c, a }, ri) => {
      const band = this._add(this.add.graphics());
      const yBase = H * (0.2 + ri * 0.12);
      const amp   = 28 + ri * 8;
      const freq  = 0.008 + ri * 0.002;
      const phase = ri * 1.1;

      // Draw wavy ribbon using a polygon
      band.fillStyle(c, a);
      band.beginPath();
      for (let x = 0; x <= W; x += 6) {
        const y = yBase + Math.sin(x * freq + phase) * amp;
        x === 0 ? band.moveTo(x, y - 30) : band.lineTo(x, y - 30);
      }
      for (let x = W; x >= 0; x -= 6) {
        const y = yBase + Math.sin(x * freq + phase) * amp;
        band.lineTo(x, y + 30);
      }
      band.closePath();
      band.fillPath();

      // Animate ribbon drifting up/down
      this.tweens.add({
        targets: band,
        y: Phaser.Math.Between(-18, 18),
        alpha: { from: 0.7, to: 1.2 },
        duration: Phaser.Math.Between(4000, 7000),
        yoyo: true, repeat: -1,
        delay: ri * 600,
        ease: 'Sine.easeInOut'
      });
    });

    // Subtle horizon glow (green aurora base)
    const glow = this._add(this.add.graphics());
    glow.fillGradientStyle(0x00e5b0, 0x00e5b0, 0x020e18, 0x020e18, 0);
    glow.fillGradientStyle(0x00b890, 0x00b890, 0x020e18, 0x020e18, 1);
    glow.fillRect(0, H * 0.55, W, H * 0.18);
    glow.alpha = 0.07;
    this.tweens.add({ targets:glow, alpha:0.13, duration:5000, yoyo:true, repeat:-1, ease:'Sine.easeInOut' });

    // Ground/horizon: very dark, almost invisible
    const ground = this._add(this.add.graphics());
    ground.fillGradientStyle(0x010810, 0x010810, 0x010510, 0x010510, 1);
    ground.fillRect(0, H * 0.82, W, H * 0.18);

    // Treeline silhouette along horizon
    const trees = this._add(this.add.graphics());
    trees.fillStyle(0x01060e, 1);
    for (let i = 0; i < 22; i++) {
      const tx = (W / 21) * i + Phaser.Math.Between(-8, 8);
      const th = Phaser.Math.Between(H * 0.07, H * 0.16);
      const tw = Phaser.Math.Between(14, 24);
      trees.fillTriangle(tx, H * 0.82 - th, tx - tw, H * 0.82, tx + tw, H * 0.82);
    }
    trees.fillRect(0, H * 0.82, W, H * 0.18);
  }

  // ── Sunset Beach ─────────────────────────────────
  _sunsetBeach(W, H) {
    const g = this._add(this.add.graphics());
    g.fillGradientStyle(0xff7043, 0xff7043, 0x4a148c, 0x4a148c, 1);
    g.fillRect(0, 0, W, H * 0.68);
    g.fillGradientStyle(0x0d47a1, 0x0d47a1, 0x010610, 0x010610, 1);
    g.fillRect(0, H * 0.68, W, H * 0.32);

    const sg = this._add(this.add.graphics());
    sg.fillStyle(0xffe082, 1);
    sg.fillCircle(0, 0, 38);
    sg.setPosition(W * 0.5, H * 0.34);

    const glow = this._add(this.add.graphics());
    glow.fillStyle(0xffcc02, 0.18);
    glow.fillCircle(0, 0, 72);
    glow.setPosition(W * 0.5, H * 0.34);
    this.tweens.add({ targets:glow, scaleX:1.15, scaleY:1.15, alpha:0.08,
      duration:2200, yoyo:true, repeat:-1, ease:'Sine.easeInOut' });

    for (let w = 0; w < 4; w++) {
      const wave = this._add(this.add.graphics());
      const wy = H * 0.71 + w * 14;
      wave.lineStyle(1.5, 0x90caf9, 0.35 - w * 0.06);
      wave.beginPath();
      for (let x = 0; x <= W; x += 4) {
        const y = wy + Math.sin(x / 55 + w * 1.2) * 5;
        x === 0 ? wave.moveTo(x, y) : wave.lineTo(x, y);
      }
      wave.strokePath();
      this.tweens.add({ targets:wave, x:w%2===0?12:-12,
        duration:Phaser.Math.Between(2500,4000), yoyo:true, repeat:-1, ease:'Sine.easeInOut' });
    }
  }

  // ── Cozy Forest ──────────────────────────────────
  _cozyForest(W, H) {
    const g = this._add(this.add.graphics());
    g.fillGradientStyle(0x071207, 0x071207, 0x020802, 0x020802, 1);
    g.fillRect(0, 0, W, H);
    g.fillStyle(0x061006, 1);
    g.fillRect(0, H * 0.76, W, H * 0.24);

    const moon = this._add(this.add.graphics());
    moon.fillStyle(0xfff9c4, 0.8);
    moon.fillCircle(0, 0, 22);
    moon.fillStyle(0x071207, 1);
    moon.fillCircle(10, -5, 17);
    moon.setPosition(W * 0.8, H * 0.12);

    [0.04,0.13,0.22,0.32,0.65,0.75,0.85,0.94].forEach(xp => {
      const tree = this._add(this.add.graphics());
      tree.fillStyle(0x030d03, 1);
      const tx = W * xp, th = Phaser.Math.Between(H*0.28, H*0.52), tw = Phaser.Math.Between(28,52);
      tree.fillTriangle(tx, H*0.76-th, tx-tw, H*0.76, tx+tw, H*0.76);
      tree.fillRect(tx-5, H*0.76, 10, 24);
    });

    for (let i = 0; i < 14; i++) {
      const ff = this._add(this.add.graphics());
      ff.fillStyle(0xffff99, 1);
      ff.fillCircle(0, 0, 2);
      ff.setPosition(Phaser.Math.Between(W*0.1, W*0.9), Phaser.Math.Between(H*0.3, H*0.74));
      ff.alpha = 0;
      this.tweens.add({ targets:ff, alpha:{from:0,to:0.85},
        x:ff.x+Phaser.Math.Between(-40,40), y:ff.y+Phaser.Math.Between(-20,20),
        duration:Phaser.Math.Between(1500,3500), yoyo:true, repeat:-1,
        delay:Phaser.Math.Between(0,2500), ease:'Sine.easeInOut' });
    }
  }

  // ── Starry Night ─────────────────────────────────
  _starryNight(W, H) {
    const g = this._add(this.add.graphics());
    g.fillGradientStyle(0x01020e, 0x01020e, 0x030518, 0x030518, 1);
    g.fillRect(0, 0, W, H);

    const moon = this._add(this.add.graphics());
    moon.fillStyle(0xfffde7, 0.95);
    moon.fillCircle(0, 0, 32);
    moon.fillStyle(0x01020e, 1);
    moon.fillCircle(11, -7, 25);
    moon.setPosition(W * 0.76, H * 0.15);

    const mg = this._add(this.add.graphics());
    mg.fillStyle(0xfffde7, 0.06);
    mg.fillCircle(0, 0, 65);
    mg.setPosition(W * 0.76, H * 0.15);
    this.tweens.add({ targets:mg, scaleX:1.2, scaleY:1.2, alpha:0.02, duration:3000, yoyo:true, repeat:-1 });

    for (let i = 0; i < 90; i++) {
      const s = this._add(this.add.graphics());
      const bright = 0.4 + Math.random() * 0.6;
      s.fillStyle(0xffffff, bright);
      s.fillCircle(0, 0, Math.random() * 1.6 + 0.4);
      s.setPosition(Phaser.Math.Between(0,W), Phaser.Math.Between(0, H*0.85));
      if (Math.random() > 0.45) {
        this.tweens.add({ targets:s, alpha:{from:bright,to:0.05},
          duration:Phaser.Math.Between(800,3000), yoyo:true, repeat:-1,
          delay:Phaser.Math.Between(0,2500) });
      }
    }
  }

  // ── Mountain Summit ───────────────────────────────
  _mountain(W, H) {
    const g = this._add(this.add.graphics());
    g.fillGradientStyle(0x0d1b2a, 0x0d1b2a, 0x040810, 0x040810, 1);
    g.fillRect(0, 0, W, H);

    const m1 = this._add(this.add.graphics());
    m1.fillStyle(0x0f1e30, 1);
    m1.fillTriangle(W*0.05,H*0.82, W*0.32,H*0.28, W*0.58,H*0.82);
    m1.fillTriangle(W*0.38,H*0.82, W*0.62,H*0.32, W*0.88,H*0.82);
    m1.fillRect(0, H*0.82, W, H*0.18);

    const m2 = this._add(this.add.graphics());
    m2.fillStyle(0x071018, 1);
    m2.fillTriangle(-W*0.05,H, W*0.22,H*0.5, W*0.48,H);
    m2.fillTriangle(W*0.52,H, W*0.78,H*0.44, W*1.05,H);

    const sn = this._add(this.add.graphics());
    sn.fillStyle(0xdde8f0, 0.88);
    sn.fillTriangle(W*0.32,H*0.28, W*0.25,H*0.41, W*0.39,H*0.41);
    sn.fillTriangle(W*0.62,H*0.32, W*0.55,H*0.44, W*0.69,H*0.44);
    sn.fillTriangle(W*0.22,H*0.5,  W*0.17,H*0.59, W*0.27,H*0.59);
    sn.fillTriangle(W*0.78,H*0.44, W*0.73,H*0.53, W*0.83,H*0.53);

    for (let i = 0; i < 40; i++) {
      const s = this._add(this.add.graphics());
      s.fillStyle(0xffffff, Math.random()*0.5+0.1);
      s.fillCircle(0, 0, Math.random()+0.5);
      s.setPosition(Phaser.Math.Between(0,W), Phaser.Math.Between(0, H*0.45));
    }

    for (let c = 0; c < 3; c++) {
      const cl = this._add(this.add.graphics());
      cl.fillStyle(0x1c3050, 0.55);
      const cx = W*(0.12+c*0.3), cy = H*(0.08+c*0.04);
      cl.fillEllipse(cx, cy, 85, 22);
      cl.fillEllipse(cx+28, cy-9, 60, 20);
      cl.fillEllipse(cx-18, cy-7, 50, 18);
      this.tweens.add({ targets:cl, x:c%2===0?18:-18,
        duration:Phaser.Math.Between(9000,16000), yoyo:true, repeat:-1, ease:'Sine.easeInOut' });
    }
  }
}

// ═══════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════
function render() {
  const t      = tr();
  const streak = calcStreak(app.entries);
  const logged = app.entries.some(e => e.date === todayStr());

  document.getElementById('panel').innerHTML = [
    renderHeader(t, streak),
    pendingMilestone ? renderMilestone(t) : '',
    (logged && !redoing) ? renderLogged(t, streak) : renderPicker(t),
    app.unlockedBgs.length > 1 ? renderBgPicker(t) : '',
  ].join('');

  document.getElementById('drawer-root').innerHTML = renderDrawer(t);

  attach();
}

function renderHeader(t, streak) {
  const opts = Object.entries(LANG_FLAGS).map(([code, flag]) =>
    `<button class="lang-opt${app.lang===code?' active':''}" onclick="setLang('${code}')">${flag} ${LANG_NAMES[code]}</button>`
  ).join('');
  return `
  <div class="header">
    <div class="app-title">${t.title[0]} <span>${t.title[1]}</span></div>
    <div class="header-right">
      <div class="lang-wrap">
        <button class="lang-btn" id="lang-btn">${LANG_FLAGS[app.lang]} ${app.lang.toUpperCase()}</button>
        <div class="lang-menu${langMenuOpen?' open':''}" id="lang-menu">${opts}</div>
      </div>
      <button class="hist-btn" onclick="openHistory()">📋</button>
      <div class="streak-pill">🔥 ${streak} ${t.streakLabel}</div>
    </div>
  </div>`;
}

function renderMilestone(t) {
  const [icon, msg] = t.milestones[pendingMilestone] || ['🎉',''];
  return `
  <div class="milestone-banner">
    <div class="big">${icon}</div>
    <p>${msg}</p>
    <button class="milestone-ok" onclick="dismissMilestone()">OK!</button>
  </div>`;
}

function renderPicker(t) {
  const buttons = MOODS.map(m => {
    const sel = selectedMood === m.id;
    return `<button class="mood-btn${sel?' sel':''}" data-mood="${m.id}"
      style="border-color:${sel?m.color:'rgba(60,60,100,0.4)'};
             background:${sel?m.color+'22':'rgba(12,12,28,0.6)'};
             box-shadow:${sel?'0 0 16px '+m.glow:'none'};">
      <span class="em">${m.emoji}</span>
      <span>${t.moods[m.id]}</span>
    </button>`;
  }).join('');

  const prompt = selectedMood ? `
    <div class="prompt-box">"${t.prompts[selectedMood]}"</div>
    <button class="save-btn" id="save-btn">${redoing ? t.updateMood : t.save}</button>
    ${redoing ? `<button class="cancel-link" onclick="cancelRedo()">${t.cancelChange}</button>` : ''}` : `
    ${redoing ? `<button class="cancel-link" onclick="cancelRedo()">${t.cancelChange}</button>` : ''}`;

  return `
  <div class="card">
    <div class="card-label">${t.howFeeling}</div>
    <div class="mood-grid">${buttons}</div>
    ${prompt}
  </div>`;
}

function renderLogged(t, streak) {
  const last = app.entries.slice().reverse().find(e => e.date === todayStr());
  const mood = last ? MOODS.find(m => m.id === last.mood) : null;
  return `
  <div class="card logged-card">
    ${mood ? `<div class="logged-emoji">${mood.emoji}</div>` : ''}
    <div class="logged-title">${t.alreadyLogged}</div>
    <div class="logged-sub">${t.comeBack}</div>
    <div class="logged-streak">🔥 ${streak}</div>
    <div class="logged-streak-label">${t.streakLabel}</div>
    <button class="change-btn" onclick="startRedo()">${t.changeMood}</button>
  </div>`;
}

function renderBgPicker(t) {
  const btns = app.unlockedBgs.map(bg =>
    `<button class="bg-btn${app.currentBg===bg?' active':''}" onclick="setBg('${bg}')">${t.bgNames[bg]}</button>`
  ).join('');
  return `
  <div class="card">
    <div class="card-label">${t.bgLabel}</div>
    <div class="bg-grid">${btns}</div>
  </div>`;
}

function renderDrawer(t) {
  const today = todayStr();
  const yest  = new Date(Date.now()-86400000).toISOString().slice(0,10);

  // Sort newest first
  const entries = [...app.entries].sort((a,b) => b.date.localeCompare(a.date));

  let body = '';
  if (!entries.length) {
    body = `<div class="hist-empty">
      <div class="hist-empty-icon">📭</div>
      <div>${t.noHistory}</div>
    </div>`;
  } else {
    let lastGroup = null;
    entries.forEach(e => {
      const mood = MOODS.find(m => m.id === e.mood);
      if (!mood) return;

      let group;
      if (e.date === today)    group = t.today;
      else if (e.date === yest) group = t.yesterday;
      else {
        const d = new Date(e.date + 'T00:00:00');
        group = d.toLocaleDateString(app.lang === 'zh' ? 'zh-CN' : app.lang, { month: 'long', year: 'numeric' });
      }

      if (group !== lastGroup) {
        body += `<div class="hist-group-label">${group}</div>`;
        lastGroup = group;
      }

      const d = new Date(e.date + 'T00:00:00');
      const dateStr = e.date === today || e.date === yest
        ? ''
        : d.toLocaleDateString(app.lang === 'zh' ? 'zh-CN' : app.lang, { weekday:'short', month:'short', day:'numeric' });

      body += `<div class="hist-item">
        <span class="hi-emoji">${mood.emoji}</span>
        <div class="hi-info">
          <div class="hi-mood">${t.moods[mood.id]}</div>
          ${dateStr ? `<div class="hi-date">${dateStr}</div>` : ''}
        </div>
        <div class="hi-dot" style="background:${mood.color};box-shadow:0 0 6px ${mood.glow};"></div>
      </div>`;
    });
  }

  return `
  <div class="drawer-backdrop${historyOpen?' open':''}" onclick="closeHistory()"></div>
  <div class="drawer${historyOpen?' open':''}">
    <div class="drawer-header">
      <div class="drawer-title">${t.historyLabel}</div>
      <button class="drawer-close" onclick="closeHistory()">✕</button>
    </div>
    <div class="drawer-body">${body}</div>
  </div>`;
}

// ═══════════════════════════════════════════════════
//  EVENT ATTACHMENT
// ═══════════════════════════════════════════════════
function attach() {
  document.querySelectorAll('.mood-btn').forEach(btn => {
    btn.addEventListener('click', () => { selectedMood = btn.dataset.mood; render(); });
  });

  const sb = document.getElementById('save-btn');
  if (sb) sb.addEventListener('click', saveMood);

  const langBtn  = document.getElementById('lang-btn');
  const langMenu = document.getElementById('lang-menu');
  if (langBtn && langMenu) {
    langBtn.addEventListener('click', e => {
      e.stopPropagation();
      langMenuOpen = !langMenuOpen;
      langMenu.classList.toggle('open', langMenuOpen);
    });
  }
}

document.addEventListener('click', () => {
  if (langMenuOpen) { langMenuOpen = false; render(); }
});

// ═══════════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════════
function setLang(code) {
  app.lang = code; langMenuOpen = false; persist(app); render();
}

function setBg(name) {
  app.currentBg = name; persist(app);
  const sc = getBgScene(); if (sc) sc.switchTo(name);
  render();
}

function dismissMilestone() { pendingMilestone = null; render(); }

function openHistory()  { historyOpen = true;  render(); }
function closeHistory() { historyOpen = false; render(); }

function startRedo() {
  const today = todayStr();
  const last  = app.entries.slice().reverse().find(e => e.date === today);
  selectedMood = last ? last.mood : null;
  redoing = true;
  render();
}

function cancelRedo() {
  redoing = false;
  selectedMood = null;
  render();
}

function saveMood() {
  if (!selectedMood) return;
  const today = todayStr();

  // Remove existing entry for today when redoing
  app.entries = app.entries.filter(e => e.date !== today);

  app.entries.push({ date: today, mood: selectedMood });
  redoing = false;
  const streak = calcStreak(app.entries);
  if (streak > (app.bestStreak||0)) app.bestStreak = streak;

  if (MILESTONE_DAYS.includes(streak)) {
    pendingMilestone = streak;
    const newBg = MILESTONE_BG[streak];
    if (newBg && !app.unlockedBgs.includes(newBg)) {
      app.unlockedBgs.push(newBg);
      app.currentBg = newBg;
      const sc = getBgScene(); if (sc) sc.switchTo(newBg);
    }
  }

  persist(app);
  selectedMood = null;
  render();
  showToast(streak > 1 ? `🔥 ${streak} ${tr().streakLabel}!` : '✅');
}

// ═══════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

render();
</script>
</body>
</html>
